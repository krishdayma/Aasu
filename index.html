<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aasu</title>
    <style>
        /* Modern Reset and Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Romantic Gradient Background */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            overflow: hidden;
            color: #fff;
        }

        .container {
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Main Heading */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }

        /* Subtext */
        p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            font-style: italic;
        }

        /* Heart Animation */
        .heart-icon {
            display: inline-block;
            animation: beat 1.5s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>I love you aasu <span class="heart-icon">🫀</span></h1>
        <p>You given me a new life my heart</p>
    </div>

</body>
</html>
